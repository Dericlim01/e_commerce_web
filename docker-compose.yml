services:
  postgres_db:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: e_commerce_web/Dockerfile
    container_name: ecommerce_web
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres_db
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=ecommerce_db;Username=postgres;Password=postgres

volumes:
  postgres_data:
